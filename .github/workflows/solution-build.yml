# =============================================================================
# solution-build -- the sibling-complete build and run, as executable
# documentation.
#
# WHICH TREE THIS BUILDS, AND WHY ONLY ONE
#
# This repository holds five trees (README.md). This workflow builds and runs
# DirectExamples only -- the tree whose siblings are Msgcore and TargetCore.
# FacadeExamples, ComExamples, dotNetExamples and PanamaJavaExamples
# additionally need TargetFacade built and, for two of them, its COM server
# REGISTERED; PanamaJavaExamples needs a JDK with Panama on top of that. Those
# are materially different jobs with much longer prerequisite chains, and
# pretending to cover them from here would be the same fiction this file exists
# to avoid. Their own run_all.ps1 scripts build their prerequisites and are the
# supported way to run them.
#
# WHY THIS IS workflow_dispatch ONLY, AND MUST STAY THAT WAY
#
# This is the job that actually verifies the harnesses, and it cannot run on
# push, because two of the things it needs are not in this repository and one of
# them is not published anywhere. README.md "The sibling dependencies" describes
# the coupling in full; the short version is that these projects reach
# `..\..\..\Msgcore`, `..\..\..\TargetCore`, `..\..\..\lib`, `..\..\..\bin` and
# `..\..\..\vsutils` by relative path, assuming they are checked out inside the
# parent MSCS solution -- three levels and not two, because a project file sits
# at <repo>/<Tree>/<Harness>/.
#
#   Msgcore, TargetCore   PRIVATE repositories. Reachable, given a token -- see
#                         the note on MSCS_SIBLING_TOKEN below.
#   Platform/             Taken from Msgcore's VENDORED copy (Msgcore/Platform),
#                         which Msgcore's own hygiene job pins to an upstream
#                         commit. TargetCore's stdafx.h includes
#                         "../Msgcore/Platform/platform.h", so it must exist as a peer.
#   vsutils/              NOT PUBLISHED ANYWHERE. Nine of the twelve harnesses
#                         compile ..\..\..\vsutils\DelayLoadReport.cpp, so this
#                         workflow cannot be run without being told where to
#                         find it. That is what `vsutils_repo` is, and it has no
#                         default on purpose.
#   $(KgnRoot)            RouteLoopbackTest's alone, and a project outside the
#                         MSCS tree entirely. See `kgn_root` below: without it,
#                         that ONE harness is not built and the other eleven are
#                         unaffected. This is why the build below names targets
#                         explicitly instead of building the whole solution.
#
# The tempting alternative is a job that runs on every push, notices the
# siblings are absent, prints "skipped -- siblings not available" and exits 0.
# That is rejected here deliberately. It would put a green tick on every commit
# for having verified nothing. So: no automatic trigger, and no silent skip. If
# the siblings are not supplied, this workflow FAILS with an explanation rather
# than passing.
#
# What that leaves is still worth shipping. Even unrun, this file is the build
# contract written down in a form that cannot drift into fiction: the directory
# layout, the two DIFFERENT values $(WDMSCS_LIB) has to take, the staging copies
# and the run command are all here in executable form, and anyone with access to
# the siblings can run it against a branch from the Actions tab and get a real
# answer.
#
# WHAT A GREEN RUN PROVES
#   * Msgcore and TargetCore build from their own .vcxproj files at the chosen
#     configuration, and DirectExamples' harnesses link against them.
#   * Ten single-process harnesses and the two-process AlexInterop pair run
#     headless to completion and exit 0 -- including the server side of
#     AlexInterop, which is the only signal in this repository that a message
#     crossed a real process boundary.
#
# WHAT A GREEN RUN DOES NOT PROVE
#   * Nothing about AlexTest, which is interactive by design (it blocks on
#     getchar() and returns 0 unconditionally) and is BUILT but never run. See
#     DirectExamples/About.md.
#   * Nothing about Com232MeshTest's actual serial path. A GitHub runner has no
#     com0com pair, so it reports SETUP (exit 1) and run_all.ps1 counts that
#     separately from a failure -- deliberately, since a missing prerequisite is
#     not a defect. The serial transport is verified on hardware or not at all.
#   * Nothing about RouteLoopbackTest unless `kgn_root` was supplied.
#   * Nothing about Win32 or the static link shapes. This tree is x64-only and
#     dynamic-only.
#   * Nothing about the OTHER configuration. Run it twice if you want both;
#     Debug and Release have historically differed in timing-sensitive harnesses.
#
# NOTE ON `MSCS_SIBLING_TOKEN`: `github.token` is scoped to THIS repository and
# cannot read a different private one, so a fine-grained PAT with read access to
# the sibling repositories has to be supplied as that secret. Without it the
# checkout steps below fail with a 404 that reads like a missing repository
# rather than a missing permission -- which is why the layout check afterwards
# names the token explicitly.
# =============================================================================

name: solution build and run (siblings REQUIRED, manual only)

on:
  workflow_dispatch:
    inputs:
      vsutils_repo:
        description: >-
          owner/repo providing vsutils/DelayLoadReport.cpp at its root (i.e. the
          parent MSCS tree). NOT published with this repository - there is no
          default and there is no fallback. Leave blank and this workflow fails
          on purpose.
        required: true
        type: string
      vsutils_ref:
        description: Branch, tag or SHA of that repository.
        required: false
        default: main
        type: string
      msgcore_repo:
        description: owner/repo providing Msgcore (with its vendored Platform/).
        required: false
        default: IvywareAU/Msgcore
        type: string
      msgcore_ref:
        description: Branch, tag or SHA of Msgcore.
        required: false
        default: master
        type: string
      targetcore_repo:
        description: owner/repo providing TargetCore.
        required: false
        default: IvywareAU/TargetCore
        type: string
      targetcore_ref:
        description: Branch, tag or SHA of TargetCore.
        required: false
        default: master
        type: string
      configuration:
        description: Which configuration to build and run. x64 only.
        required: true
        default: Debug
        type: choice
        options: [Debug, Release]
      kgn_root:
        description: >-
          Absolute path to the KGN tree providing treehub_runtime, for
          RouteLoopbackTest ONLY. Leave blank and that one harness is neither
          built nor run; the other eleven are unaffected.
        required: false
        default: ""
        type: string
      run_harnesses:
        description: >-
          Run the harnesses after building. Turn this off to check the build
          alone when a runtime failure is already understood.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build-and-run:
    name: ${{ inputs.configuration }}|x64 (sibling-complete)
    # windows-2022, NOT windows-latest. The label moved off the VS 2022 image,
    # and every .vcxproj here names PlatformToolset v143. Same pin, for the same
    # reason, as the sibling Msgcore and TargetCore workflows.
    runs-on: windows-2022

    env:
      # The parent-solution root assembled on the runner. Every relative path in
      # every .vcxproj is resolved against this layout:
      #   $MSCS/Msgcore  $MSCS/TargetCore  $MSCS/Platform  $MSCS/vsutils
      #   $MSCS/lib/x64/<Cfg>  $MSCS/bin/<Cfg>64
      #   $MSCS/_TargetCore_UseExamples/DirectExamples
      MSCS: ${{ github.workspace }}/mscs

    steps:
      # ---- checkout the assembled tree ------------------------------------
      # This repository nests inside the parent solution under its own name,
      # which is the layout README.md documents and the one the ..\..\..\ paths
      # in every .vcxproj assume -- a project file is at
      # mscs/_TargetCore_UseExamples/<Tree>/<Harness>/, so three levels up is
      # mscs/. Checking it out anywhere else silently breaks every one of them.
      - name: Check out this repository into the solution
        uses: actions/checkout@v5
        with:
          path: mscs/_TargetCore_UseExamples

      - name: Check out Msgcore
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.msgcore_repo }}
          ref: ${{ inputs.msgcore_ref }}
          token: ${{ secrets.MSCS_SIBLING_TOKEN || github.token }}
          path: mscs/Msgcore

      - name: Check out TargetCore
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.targetcore_repo }}
          ref: ${{ inputs.targetcore_ref }}
          token: ${{ secrets.MSCS_SIBLING_TOKEN || github.token }}
          path: mscs/TargetCore

      # Sparse, because the only thing wanted out of the parent tree is one
      # directory, and cloning the whole MSCS working tree to get one 188-line
      # file would be absurd.
      - name: Check out vsutils from the parent solution
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.vsutils_repo }}
          ref: ${{ inputs.vsutils_ref }}
          token: ${{ secrets.MSCS_SIBLING_TOKEN || github.token }}
          path: parent
          sparse-checkout: vsutils
          sparse-checkout-cone-mode: false

      - name: Assemble Platform/ and vsutils/ as peers
        run: |
          # Platform/ is not a repository of its own here. Msgcore vendors a copy
          # and its hygiene job pins that copy to an upstream commit, so it is the
          # authoritative one available to CI. TargetCore's stdafx.h includes
          # "../Msgcore/Platform/platform.h" and will not compile without it.
          Copy-Item "$env:MSCS/Msgcore/Platform" "$env:MSCS/Platform" -Recurse -Force
          Copy-Item "${{ github.workspace }}/parent/vsutils" "$env:MSCS/vsutils" -Recurse -Force

      # Fail loudly and specifically. A missing sibling must never read as a
      # skip, and it must never read as a defect in THIS repository either.
      - name: Verify the sibling layout
        shell: bash
        run: |
          missing=0
          for p in Msgcore/"Msgcore(2022).vcxproj" \
                   TargetCore/"TargetCore(2022).vcxproj" \
                   Platform/platform.h \
                   vsutils/DelayLoadReport.cpp \
                   _TargetCore_UseExamples/DirectExamples/"DirectExamples(2022).sln"; do
            if [ -e "$MSCS/$p" ]; then echo "  ok      $p"
            else echo "  MISSING $p"; missing=1; fi
          done
          if [ "$missing" != "0" ]; then
            echo
            echo "The sibling layout this build needs was not assembled. Nothing was"
            echo "built and nothing was verified. Check that vsutils_repo names a"
            echo "repository carrying vsutils/ at its root, and that the"
            echo "MSCS_SIBLING_TOKEN secret grants read access to the private"
            echo "Msgcore and TargetCore repositories -- without it those checkouts"
            echo "fail with a 404 that looks like a missing repository."
            echo "See _TargetCore_UseExamples/README.md, 'The sibling dependencies'."
            echo "The solution built here is DirectExamples; the other four trees"
            echo "need TargetFacade and its COM server and are run from their own"
            echo "run_all.ps1 -- see the header of this file."
            exit 1
          fi

      - name: Locate MSBuild
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }
          $msbuild = & $vswhere -latest -products * `
              -requires Microsoft.Component.MSBuild `
              -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw "No MSBuild found by vswhere." }
          Write-Host "MSBuild: $msbuild"
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ---- the two cores ---------------------------------------------------
      #
      # $(WDMSCS_LIB) TAKES TWO DIFFERENT VALUES HERE AND THAT IS NOT A MISTAKE.
      #
      #   Msgcore     has a Directory.Build.props that, in a standalone clone,
      #               APPENDS \$(Platform)\$(Configuration) to whatever it is
      #               given. So it is handed the lib ROOT.
      #   TargetCore  has no such file and uses the variable verbatim, for both
      #               its <AdditionalLibraryDirectories> and its <ImportLibrary>.
      #               So it is handed the LEAF directory -- the one Msgcore.lib
      #               is now in, and the one TargetCore.lib must land in.
      #
      # It is set as an ENVIRONMENT variable, never as /p:. An MSBuild global
      # property cannot be reassigned by a PropertyGroup, so /p:WDMSCS_LIB=...
      # would defeat Msgcore's props file and quietly write the import library to
      # the lib root instead of the per-configuration directory.
      #
      # If TargetCore is ever built with WDMSCS_LIB unset, <ImportLibrary> reads
      # "\TargetCore.lib" and link.exe writes it to the ROOT OF THE DRIVE with
      # the build still green. Msgcore's Directory.Build.props documents that
      # exact incident. The assertions after each build are what stop it here.
      - name: Build Msgcore ${{ inputs.configuration }}|x64
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $env:WDMSCS_LIB = "$env:MSCS\lib"          # ROOT -- props appends the rest
          New-Item -ItemType Directory -Force -Path $env:WDMSCS_LIB | Out-Null

          & $env:MSBUILD "$env:MSCS\Msgcore\Msgcore(2022).vcxproj" `
              /nologo /m:1 /v:minimal `
              /p:Configuration=${{ inputs.configuration }} /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $lib = "$env:MSCS\lib\x64\${{ inputs.configuration }}\Msgcore.lib"
          if (-not (Test-Path $lib)) {
              Write-Host "::error::$lib was not produced. Msgcore's Directory.Build.props"
              Write-Host "did not take its standalone branch -- check that nothing above"
              Write-Host "mscs\ provides a Directory.Build.props for it to chain to."
              exit 1
          }
          Write-Host "staged $lib"

      - name: Stage Msgcore.dll
        run: |
          $cfg = "${{ inputs.configuration }}"
          $bin = "$env:MSCS\bin\${cfg}64"            # the ..\..\bin\<Cfg>64 the harnesses copy from
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Copy-Item "$env:MSCS\Msgcore\out\x64\$cfg\Msgcore.dll" $bin -Force
          Copy-Item "$env:MSCS\Msgcore\out\x64\$cfg\Msgcore.pdb" $bin -Force -ErrorAction SilentlyContinue
          Get-ChildItem $bin | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Build TargetCore ${{ inputs.configuration }}|x64
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $cfg = "${{ inputs.configuration }}"
          $env:WDMSCS_LIB = "$env:MSCS\lib\x64\$cfg"  # LEAF -- used verbatim

          & $env:MSBUILD "$env:MSCS\TargetCore\TargetCore(2022).vcxproj" `
              /nologo /m:1 /v:minimal `
              /p:Configuration=$cfg /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $lib = "$env:WDMSCS_LIB\TargetCore.lib"
          if (-not (Test-Path $lib)) {
              Write-Host "::error::$lib was not produced -- the harness link would fail"
              Write-Host "with LNK1181. Check WDMSCS_LIB was visible to this step."
              exit 1
          }
          Copy-Item "$env:MSCS\TargetCore\out\x64\$cfg\TargetCore.dll" "$env:MSCS\bin\${cfg}64" -Force
          Copy-Item "$env:MSCS\TargetCore\out\x64\$cfg\TargetCore.pdb" "$env:MSCS\bin\${cfg}64" -Force -ErrorAction SilentlyContinue
          Write-Host "staged $lib and TargetCore.dll"

      # ---- the harnesses ---------------------------------------------------
      - name: Build the harnesses
        # Passed through env, not interpolated into the script body: a
        # ${{ inputs.* }} substituted straight into a run block is executed as
        # code by whoever dispatched the workflow. These are read as data here.
        env:
          KGN_ROOT_INPUT: ${{ inputs.kgn_root }}
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          # NAMED TARGETS, not the whole solution, and that is the point.
          # RouteLoopbackTest links treehub_runtime.lib out of $(KgnRoot), which
          # is not part of the MSCS tree; building the solution wholesale would
          # fail on that one project for a reason that says nothing about the
          # other eleven. It is added back only when a KgnRoot was supplied.
          $targets = @(
              'AlexInterop', 'AlexTest', 'Com232MeshTest', 'DmxMeshTest',
              'ExplorerTest', 'LocalInMemoryTest', 'PipeMeshTest',
              'PipeMsgFactoryTest', 'PipeMsgMapTest', 'TwoConTest', 'WsaMeshTest'
          )
          if ($env:KGN_ROOT_INPUT) {
              $env:KgnRoot = $env:KGN_ROOT_INPUT
              $targets += 'RouteLoopbackTest'
              Write-Host "KgnRoot supplied: RouteLoopbackTest IS in this build."
          } else {
              Write-Host "::notice::No kgn_root supplied -- RouteLoopbackTest is NOT built or run."
          }

          # Build the switch as a string. `/t:($targets -join ';')` does NOT
          # interpolate in PowerShell argument position -- msbuild would receive
          # the literal parenthesised text and fail to resolve a target.
          $targetSwitch = '/t:' + ($targets -join ';')
          Write-Host $targetSwitch

          # /clp:NoSummary keeps each warning on exactly one line. At normal
          # verbosity MSBuild re-lists every warning in its end-of-build summary,
          # so a naive count returns twice the real figure.
          & $env:MSBUILD "$env:MSCS\_TargetCore_UseExamples\DirectExamples\DirectExamples(2022).sln" `
              /nologo /m /v:normal /clp:NoSummary `
              $targetSwitch `
              /p:Configuration=$env:CONFIGURATION /p:Platform=x64 `
              2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::The harness build failed (msbuild exit $LASTEXITCODE)."
              exit $LASTEXITCODE
          }

          # Zero is the documented state of this tree, and unlike the cores there
          # is no historical backlog to work down -- so the baseline is 0 and any
          # regression is a failure rather than a notice.
          $lines = @(Select-String -Path build.log -Pattern ': warning C\d+')
          Write-Host "Compiler warning lines: $($lines.Count) (baseline 0)"
          if ($lines.Count -gt 0) {
              $lines | ForEach-Object { Write-Host "  $($_.Line.Trim())" }
              Write-Host "::error::These harnesses built clean at 0 warnings; they now emit $($lines.Count)."
              exit 1
          }

      - name: Run the harnesses
        if: ${{ inputs.run_harnesses }}
        working-directory: mscs/_TargetCore_UseExamples/DirectExamples
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          # -NoBuild: the previous step already built, and rebuilding here would
          # both undo the named-target selection and hide a staging mistake by
          # fixing it. run_all.ps1 exits with the number of FAILED harnesses --
          # SETUP (Com232MeshTest without com0com) and SKIP (RouteLoopbackTest
          # unbuilt) are counted and printed but are not failures.
          ./run_all.ps1 -Config ${{ inputs.configuration }} -NoBuild
          $failed = $LASTEXITCODE
          if ($failed -ne 0) {
              Write-Host "::error::$failed harness(es) failed. See the table above and the uploaded logs."
              exit 1
          }
          Write-Host "No harness failed."

      - name: Upload the build log and harness output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solution-build-${{ inputs.configuration }}
          path: |
            build.log
            mscs/_TargetCore_UseExamples/DirectExamples/logs/**
          if-no-files-found: warn
